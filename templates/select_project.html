<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #014059;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 24px;
        }

        .project-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #014059;
            color: #014059;
            font-weight: 600;
            background: #f7fbfd;
            transition: all 0.15s ease;
        }

        .project-link:hover {
            background: #014059;
            color: #fff;
        }

        .empty {
            padding: 12px 16px;
            border-radius: 8px;
            background: #fff4e5;
            color: #8a5b00;
            border: 1px solid #ffd59e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Select a Project</h1>
        <p>Choose which tracker layout you want to view.</p>
        <div class="project-list">
            {% if projects %}
                {% for project in projects %}
                    <a class="project-link" href="/project/{{ project }}">{{ project }}</a>
                {% endfor %}
            {% else %}
                <div class="empty">No projects found in layout_data.</div>
            {% endif %}
        </div>
    </div>
</body>
</html>
